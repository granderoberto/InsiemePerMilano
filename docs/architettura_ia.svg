<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f172a"/></marker></defs>
<rect width="1600" height="1060" fill="#ffffff"/>
<text x="40" y="46" font-size="25" font-weight="700" text-anchor="start" fill="#0f172a">La Nostra Città, Il Nostro Futuro: integrazione dell'intelligenza artificiale</text>
<text x="40" y="72" font-size="15" font-weight="400" text-anchor="start" fill="#475569">Schema a blocchi: l'IA propone, un essere umano decide. Ogni esito è registrato e può essere rivisto da un moderatore.</text>
<rect x="40" y="120" width="250" height="150" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="56" y="148" font-size="16" font-weight="700" text-anchor="start" fill="#0f172a">Cittadino</text>
<text x="56" y="172" font-size="13.5" font-weight="400" text-anchor="start" fill="#1e293b">Browser o smartphone</text>
<text x="56" y="192" font-size="13.5" font-weight="400" text-anchor="start" fill="#1e293b">Registra l'account, invia</text>
<text x="56" y="212" font-size="13.5" font-weight="400" text-anchor="start" fill="#1e293b">segnalazioni e commenti</text>
<rect x="40" y="330" width="250" height="150" rx="12" fill="#fee2e2" stroke="#334155" stroke-width="1.6"/>
<text x="56" y="358" font-size="16" font-weight="700" text-anchor="start" fill="#0f172a">Moderatore</text>
<text x="56" y="382" font-size="13.5" font-weight="400" text-anchor="start" fill="#1e293b">Vede le code con motivo e</text>
<text x="56" y="402" font-size="13.5" font-weight="400" text-anchor="start" fill="#1e293b">punteggio; conferma o</text>
<text x="56" y="422" font-size="13.5" font-weight="400" text-anchor="start" fill="#1e293b">ribalta ogni decisione IA</text>
<rect x="40" y="540" width="250" height="110" rx="12" fill="#fee2e2" stroke="#334155" stroke-width="1.6"/>
<text x="56" y="568" font-size="16" font-weight="700" text-anchor="start" fill="#0f172a">Amministratore</text>
<text x="56" y="592" font-size="13.5" font-weight="400" text-anchor="start" fill="#1e293b">Registro delle attività,</text>
<text x="56" y="612" font-size="13.5" font-weight="400" text-anchor="start" fill="#1e293b">statistiche, soglie</text>
<rect x="370" y="120" width="330" height="530" rx="12" fill="#dbeafe" stroke="#334155" stroke-width="1.6"/>
<text x="386" y="148" font-size="16" font-weight="700" text-anchor="start" fill="#0f172a">Web app (Django)</text>
<rect x="388" y="175" width="294" height="78" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="402" y="203" font-size="15" font-weight="700" text-anchor="start" fill="#0f172a">Registrazione e accesso</text>
<text x="402" y="227" font-size="13" font-weight="400" text-anchor="start" fill="#334155">SPID/CIE oppure credenziali + documento</text>
<rect x="388" y="269" width="294" height="78" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="402" y="297" font-size="15" font-weight="700" text-anchor="start" fill="#0f172a">Nuova segnalazione</text>
<text x="402" y="321" font-size="13" font-weight="400" text-anchor="start" fill="#334155">testo, categorie, posizione, media</text>
<rect x="388" y="363" width="294" height="78" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="402" y="391" font-size="15" font-weight="700" text-anchor="start" fill="#0f172a">Commenti</text>
<text x="402" y="415" font-size="13" font-weight="400" text-anchor="start" fill="#334155">testo, risposte</text>
<rect x="388" y="457" width="294" height="78" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="402" y="485" font-size="15" font-weight="700" text-anchor="start" fill="#0f172a">Code del moderatore</text>
<text x="402" y="509" font-size="13" font-weight="400" text-anchor="start" fill="#334155">verifiche · contenuti · in attesa</text>
<rect x="388" y="551" width="294" height="78" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="402" y="579" font-size="15" font-weight="700" text-anchor="start" fill="#0f172a">Ciclo di vita</text>
<text x="402" y="603" font-size="13" font-weight="400" text-anchor="start" fill="#334155">stati da 1 a 5 imposti dal database</text>
<rect x="790" y="120" width="340" height="530" rx="12" fill="#fde68a" stroke="#334155" stroke-width="1.6"/>
<text x="806" y="148" font-size="16" font-weight="700" text-anchor="start" fill="#0f172a">Gateway IA (servizio interno)</text>
<rect x="808" y="175" width="304" height="78" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="822" y="203" font-size="15" font-weight="700" text-anchor="start" fill="#0f172a">Interfaccia unica</text>
<text x="822" y="227" font-size="13" font-weight="400" text-anchor="start" fill="#334155">un contratto per tutti i moduli</text>
<rect x="808" y="269" width="304" height="78" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="822" y="297" font-size="15" font-weight="700" text-anchor="start" fill="#0f172a">Coda dei compiti</text>
<text x="822" y="321" font-size="13" font-weight="400" text-anchor="start" fill="#334155">video e OCR in background</text>
<rect x="808" y="363" width="304" height="78" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="822" y="391" font-size="15" font-weight="700" text-anchor="start" fill="#0f172a">Regola della decisione</text>
<text x="822" y="415" font-size="13" font-weight="400" text-anchor="start" fill="#334155">vale l'esito peggiore</text>
<rect x="808" y="457" width="304" height="78" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="822" y="485" font-size="15" font-weight="700" text-anchor="start" fill="#0f172a">Sicurezza dei guasti</text>
<text x="822" y="509" font-size="13" font-weight="400" text-anchor="start" fill="#334155">se un modulo non risponde: «dubbio»</text>
<rect x="808" y="551" width="304" height="78" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="822" y="579" font-size="15" font-weight="700" text-anchor="start" fill="#0f172a">Registro decisioni</text>
<text x="822" y="603" font-size="13" font-weight="400" text-anchor="start" fill="#334155">punteggio, modello, data in log_attivita</text>
<rect x="1210" y="120" width="350" height="530" rx="12" fill="#dcfce7" stroke="#334155" stroke-width="1.6"/>
<text x="1226" y="148" font-size="16" font-weight="700" text-anchor="start" fill="#0f172a">Moduli di IA</text>
<rect x="1228" y="175" width="314" height="78" rx="9" fill="#ffffff" stroke="#166534" stroke-width="1.4"/>
<circle cx="1250" cy="199" r="12" fill="#166534"/>
<text x="1250" y="204" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="1270" y="204" font-size="14.5" font-weight="700" text-anchor="start" fill="#0f172a">Verifica del documento</text>
<text x="1242" y="225" font-size="12.5" font-weight="400" text-anchor="start" fill="#334155">OCR · corrispondenza dati · validità ·</text>
<text x="1242" y="242" font-size="12.5" font-weight="400" text-anchor="start" fill="#334155">autenticità · confronto volto/selfie</text>
<rect x="1228" y="269" width="314" height="78" rx="9" fill="#ffffff" stroke="#166534" stroke-width="1.4"/>
<circle cx="1250" cy="293" r="12" fill="#166534"/>
<text x="1250" y="298" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="1270" y="298" font-size="14.5" font-weight="700" text-anchor="start" fill="#0f172a">Classificazione categorie</text>
<text x="1242" y="319" font-size="12.5" font-weight="400" text-anchor="start" fill="#334155">propone categorie con confidenza</text>
<rect x="1228" y="363" width="314" height="78" rx="9" fill="#ffffff" stroke="#166534" stroke-width="1.4"/>
<circle cx="1250" cy="387" r="12" fill="#166534"/>
<text x="1250" y="392" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="1270" y="392" font-size="14.5" font-weight="700" text-anchor="start" fill="#0f172a">Moderazione del testo</text>
<text x="1242" y="413" font-size="12.5" font-weight="400" text-anchor="start" fill="#334155">insulti · odio · minacce ·</text>
<text x="1242" y="430" font-size="12.5" font-weight="400" text-anchor="start" fill="#334155">dati personali di terzi</text>
<rect x="1228" y="457" width="314" height="78" rx="9" fill="#ffffff" stroke="#166534" stroke-width="1.4"/>
<circle cx="1250" cy="481" r="12" fill="#166534"/>
<text x="1250" y="486" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="1270" y="486" font-size="14.5" font-weight="700" text-anchor="start" fill="#0f172a">Moderazione di immagini/video</text>
<text x="1242" y="507" font-size="12.5" font-weight="400" text-anchor="start" fill="#334155">contenuti sessuali o violenti; il testo letto</text>
<text x="1242" y="524" font-size="12.5" font-weight="400" text-anchor="start" fill="#334155">con OCR passa al filtro; video a fotogrammi</text>
<rect x="1228" y="551" width="314" height="78" rx="9" fill="#ffffff" stroke="#166534" stroke-width="1.4"/>
<circle cx="1250" cy="575" r="12" fill="#166534"/>
<text x="1250" y="580" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<text x="1270" y="580" font-size="14.5" font-weight="700" text-anchor="start" fill="#0f172a">Coerenza immagine/testo</text>
<text x="1242" y="601" font-size="12.5" font-weight="400" text-anchor="start" fill="#334155">la foto è pertinente alla descrizione?</text>
<rect x="1210" y="720" width="350" height="150" rx="12" fill="#f3e8ff" stroke="#334155" stroke-width="1.6"/>
<text x="1226" y="748" font-size="16" font-weight="700" text-anchor="start" fill="#0f172a">Modelli e servizi (da scegliere)</text>
<text x="1226" y="772" font-size="13.5" font-weight="400" text-anchor="start" fill="#1e293b">Modelli di linguaggio e visione (API)</text>
<text x="1226" y="792" font-size="13.5" font-weight="400" text-anchor="start" fill="#1e293b">OCR · riconoscimento del volto</text>
<text x="1226" y="812" font-size="13.5" font-weight="400" text-anchor="start" fill="#1e293b">Si valutano: costo, DPA, dati in UE,</text>
<text x="1226" y="832" font-size="13.5" font-weight="400" text-anchor="start" fill="#1e293b">nessun addestramento sui nostri dati</text>
<rect x="370" y="720" width="760" height="150" rx="12" fill="#e5e7eb" stroke="#334155" stroke-width="1.6"/>
<text x="386" y="748" font-size="16" font-weight="700" text-anchor="start" fill="#0f172a">Dati</text>
<text x="386" y="776" font-size="15" font-weight="700" text-anchor="start" fill="#0f172a">Database MySQL</text>
<text x="386" y="798" font-size="13" font-weight="400" text-anchor="start" fill="#334155">utenti · verifiche_identita · segnalazioni · media · classificazioni</text>
<text x="386" y="816" font-size="13" font-weight="400" text-anchor="start" fill="#334155">commenti · richieste_revisione · notifiche · log_attivita (solo aggiunte)</text>
<text x="790" y="776" font-size="15" font-weight="700" text-anchor="start" fill="#0f172a">File multimediali</text>
<text x="790" y="798" font-size="13" font-weight="400" text-anchor="start" fill="#334155">foto e video pubblicati senza metadati (EXIF)</text>
<text x="790" y="816" font-size="13" font-weight="400" text-anchor="start" fill="#334155">documento e selfie: cancellati dopo la verifica</text>
