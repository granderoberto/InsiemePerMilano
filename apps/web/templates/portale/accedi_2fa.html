{% extends "base.html" %}{% block titolo %}Codice di verifica{% endblock %}
{% block contenuto %}<div class="accesso"><h1>Codice di verifica</h1>
{% if errore %}<p class="avviso avviso-error" role="alert">{{ errore }}</p>{% endif %}
<form method="post" class="riquadro">{% csrf_token %}<div class="campo"><label for="codice">Scrivi il codice di 6 cifre dell'app di autenticazione</label><input id="codice" name="codice" inputmode="numeric" autocomplete="one-time-code" maxlength="7" required autofocus></div>
<button class="btn btn-primario" type="submit">Accedi</button> <a href="{% url 'accedi' %}">Annulla</a></form></div>{% endblock %}
